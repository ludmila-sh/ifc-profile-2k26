  var KEY='ifc_pass', tries=0;
  function norm(s){return s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'').replace(/(.)\1+/g,'$1').replace(/блядь/g,'блять');}
  function b64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  async function decrypt(pass){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pass)),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
    return new TextDecoder().decode(pt);
  }
  function mount(html){
    var app=document.getElementById('app');
    app.innerHTML=html;
    document.getElementById('gate').remove();
    document.querySelector('meta[name=theme-color]').setAttribute('content','#7a0c2e');
    app.querySelectorAll('script').forEach(function(old){var s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s);});
    window.scrollTo(0,0);
  }
  async function attempt(pass,silent){
    var btn=document.getElementById('b'),msg=document.getElementById('msg');
    if(!window.crypto||!crypto.subtle){msg.textContent='Этот браузер не умеет открывать раздевалку. Открой ссылку в Chrome или Safari.';return;}
    btn.disabled=true;
    try{
      var html=await decrypt(pass);
      try{localStorage.setItem(KEY,pass);}catch(e){}
      mount(html);
    }catch(e){
      btn.disabled=false;
      if(silent)return;
      tries++;
      var f=document.getElementById('f');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
      msg.textContent=tries<2?'Судья не засчитал. Ещё попытка.':'Подсказка: мы на турнире, я спрашиваю, ты отвечаешь двумя словами. Пауза на 3 наносекунды дольше обычного.';
    }
  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var v=document.getElementById('p').value;if(v.trim())attempt(v,false);});
  try{var saved=localStorage.getItem(KEY);if(saved)attempt(saved,true);}catch(e){}
})();
